  <text x="64" y="1592" font-family="Inter, Aptos, Arial, sans-serif" font-size="15" font-weight="500" fill="#52646C">Statistik Daerah Kabupaten Musi Rawas Utara 2026, hlm. 7–8 dan 11.</text>
  <text x="64" y="1618" font-family="Inter, Aptos, Arial, sans-serif" font-size="15" font-weight="500" fill="#52646C">Kabupaten Musi Rawas Utara Dalam Angka 2026, Tabel 3.2.3, hlm. 60.</text>
  <text x="64" y="1644" font-family="Inter, Aptos, Arial, sans-serif" font-size="15" font-weight="500" fill="#52646C">Data kerja 2025; kesehatan 2024. Porsi pekerja tak dibayar dihitung dari pekerja tiap jenis kelamin.</text>
  <text x="64" y="1670" font-family="Inter, Aptos, Arial, sans-serif" font-size="15" font-weight="500" fill="#52646C">Hitungan: perempuan 11.092/38.409; laki-laki 2.835/61.297 pekerja.</text>
  <text x="64" y="1715" font-family="Inter, Aptos, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4" fill="#8B999A">MUSI RAWAS UTARA  ·  DATA UNTUK MEMAHAMI KESETARAAN</text>
