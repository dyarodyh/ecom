<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1760" viewBox="0 0 1080 1760" role="img" aria-labelledby="title desc">
  <title id="title">Kesenjangan gender dalam kerja dan kesehatan di Musi Rawas Utara</title>
  <desc id="desc">Infografis dengan indikator TPAK, TPT, pekerja keluarga tidak dibayar tahun 2025, dan indikator kesehatan menurut jenis kelamin tahun 2024.</desc>
