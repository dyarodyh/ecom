name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Periksa Backend Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Ambil source
        uses: actions/checkout@v7

      - name: Siapkan Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod

      - name: Jalankan tes Go
        run: go test ./...

      - name: Periksa kode Go
        run: go vet ./...

      - name: Build API
        run: go build ./cmd/api

  frontend:
    name: Periksa frontend React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fe

    steps:
      - name: Ambil source
        uses: actions/checkout@v7

      - name: Siapkan Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Pasang dependensi
        run: npm ci

      - name: Periksa style kode
        run: npm run lint

      - name: Build frontend
        run: npm run build
  publish-images:
    name: Bangun dan kirim image Docker
    needs: [backend, frontend]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Ambil source
        uses: actions/checkout@v7

      - name: Siapkan Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login ke GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build dan kirim image API
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-api:${{ github.sha }}
            ghcr.io/${{ github.repository }}-api:latest

      - name: Build dan kirim image frontend
        uses: docker/build-push-action@v7
        with:
          context: ./fe
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-web:${{ github.sha }}
            ghcr.io/${{ github.repository }}-web:latest
  deploy-production:
    name: Deploy ke VPS
    needs: publish-images
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_HOST_FINGERPRINT: ${{ vars.VPS_HOST_FINGERPRINT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Siapkan SSH dan verifikasi identitas VPS
        shell: bash
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          ssh-keyscan -T 10 -t ed25519 "$VPS_HOST" > "$RUNNER_TEMP/vps_known_hosts"
          ACTUAL_FINGERPRINT=$(ssh-keygen -lf "$RUNNER_TEMP/vps_known_hosts" | awk '{print $2}')
          if [ "$ACTUAL_FINGERPRINT" != "$VPS_HOST_FINGERPRINT" ]; then
            echo "Fingerprint host VPS tidak cocok."
            exit 1
          fi

          cp "$RUNNER_TEMP/vps_known_hosts" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Tarik image dan jalankan layanan
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'cd ~/ecom/devops && sudo -n docker compose --env-file .env -f compose.prod.yaml pull && sudo -n docker compose --env-file .env -f compose.prod.yaml up -d'